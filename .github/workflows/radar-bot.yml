name: Samsun RSS Otomasyonu

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı tetiklenir
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  haberleri-guncelle:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Gereksinimleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests
        
    - name: Tarama Betiğini Çalıştır
      run: python tarayici.py
        
    - name: Değişiklikleri Kaydet (Commit & Push)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "Samsun Radar Bot"
        git add samsun_gundem.json
        git commit -m "Sistem Güncellemesi: Yeni haberler çekildi" || echo "Yeni haber yok, commit atlanıyor."
        git push
