name: Samsun Radar OSINT Botu

on:
  schedule:
    - cron: '*/15 * * * *' # Her 15 dakikada bir otomatik calisir (GitHub yogunlukta gecikebilir)
  workflow_dispatch: # GitHub sayfasindan manuel tetikleme butonu ekler

# Onceki calisma bitmeden yenisi baslarsa git push cakismalarini onler
concurrency:
  group: samsun-radar-bot
  cancel-in-progress: false

# KRITIK: Repo ayarlarinda "Workflow permissions" varsayilan olarak salt-okunur
# ise, script basarili calissa bile `git push` 403 ile sessizce basarisiz
# olur ve haberler hic guncellenmez. Bu izni acikca write yapiyoruz.
permissions:
  contents: write

jobs:
  tarama-yap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Projeyi Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tarayıcı Botu Çalıştır
        run: python "tarayıcı.py"

      - name: Değişiklik Var mı Kontrol Et
        id: degisiklik
        run: |
          if git diff --quiet -- samsun_gundem.json; then
            echo "degisti=false" >> "$GITHUB_OUTPUT"
          else
            echo "degisti=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Yeni Haberleri GitHub'a Kaydet (Commit)
        if: steps.degisiklik.outputs.degisti == 'true'
        run: |
          git config --global user.name 'SamsunRadar-Bot'
          git config --global user.email 'bot@samsunradar.local'
          git add samsun_gundem.json
          git commit -m "Radar güncellendi: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
