name: Samsun Haber Radar Botu

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch: # GitHub üzerinden manuel tetikleme butonu koyar

jobs:
  guncelle:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Gerekli Kütüphaneleri Yükle
      run: |
        pip install -r requirements.txt
        
    - name: Haberleri Tara ve JSON Oluştur
      run: python taray.py
        
    - name: Değişiklikleri Commit Et ve Gönder
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add samsun_gundem.json
        git commit -m "Güncel Samsun Haberleri Çekildi" || echo "Değişiklik yok, commit atlanıyor."
        git push
