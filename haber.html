<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsun Haber Radarı</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px 10px; 
            color: #1c1e21; 
        }
        .container { 
            max-width: 700px; 
            margin: 0 auto; 
        }
        .baslik-alani {
            text-align: center;
            margin-bottom: 25px;
        }
        .baslik-alani h1 {
            color: #d32f2f;
            margin: 0;
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        .haber-listesi { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .haber-satiri { 
            background: #ffffff; 
            padding: 16px 20px; 
            border-radius: 8px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
            text-decoration: none; 
            color: inherit; 
            border-left: 4px solid #d32f2f;
            transition: background-color 0.2s, transform 0.2s; 
            display: flex;
            flex-direction: column;
        }
        .haber-satiri:hover { 
            background-color: #f9f9f9;
            transform: translateX(4px);
        }
        .haber-basligi { 
            font-size: 16px; 
            font-weight: 600; 
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .haber-detay { 
            font-size: 13px; 
            color: #65676b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .haber-kaynak { 
            font-weight: bold; 
            color: #d32f2f; 
            background: #ffebee;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        .yukleniyor { text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <div class="baslik-alani">
            <h1>Samsun Haberleri</h1>
        </div>

        <div id="haberler" class="haber-listesi">
            <div class="yukleniyor">Haberler çekiliyor...</div>
        </div>
    </div>

    <script>
        async function haberleriGetir() {
            try {
                // Tarayıcı önbelleğini aşmak için zaman damgası ekliyoruz
                const url = 'samsun_gundem.json?t=' + new Date().getTime();
                const response = await fetch(url);
                const haberler = await response.json();
                
                const listeDiv = document.getElementById('haberler');
                listeDiv.innerHTML = ''; // Yükleniyor yazısını temizle

                haberler.forEach(haber => {
                    const linkElemani = document.createElement('a');
                    linkElemani.className = 'haber-satiri';
                    linkElemani.href = haber.link;
                    linkElemani.target = '_blank';
                    
                    linkElemani.innerHTML = `
                        <div class="haber-basligi">${haber.baslik}</div>
                        <div class="haber-detay">
                            <span class="haber-kaynak">${haber.kaynak}</span>
                            <span>${haber.tarih}</span>
                        </div>
                    `;
                    listeDiv.appendChild(linkElemani);
                });

            } catch (hata) {
                console.error("Hata:", hata);
                document.getElementById('haberler').innerHTML = '<div style="color:red; text-align:center; padding:20px; background:#fff; border-radius:8px;">Haberler yüklenirken bir sorun oluştu!</div>';
            }
        }

        // Sayfa açıldığında fonksiyonu tetikle
        haberleriGetir();
    </script>
</body>
</html>
