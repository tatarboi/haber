<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMSUN RADAR</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090f;--surface:#0f0f1a;--surface2:#141425;--card:#13131f;
  --border:#1e1e35;--border2:#2a2a4a;
  --accent:#6366f1;--accent2:#818cf8;--accent3:rgba(99,102,241,0.15);
  --red:#f43f5e;--red2:rgba(244,63,94,0.15);
  --amber:#f59e0b;--green:#10b981;
  --text:#e2e2f0;--sub:#8888aa;--dim:#3a3a5c;--white:#f0f0ff;
  --glow:rgba(99,102,241,0.25);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}

/* ─ ANIMATED BG ─ */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(99,102,241,0.08) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 80%,rgba(244,63,94,0.04) 0%,transparent 50%)}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(99,102,241,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,0.04) 1px,transparent 1px);
  background-size:50px 50px}
.scanline{position:fixed;left:0;right:0;height:120px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(99,102,241,0.03),transparent);
  animation:scan 8s linear infinite}
@keyframes scan{0%{top:-120px}100%{top:100vh}}

/* corner brackets */
.corner{position:fixed;width:20px;height:20px;z-index:5;pointer-events:none}
.corner::before,.corner::after{content:'';position:absolute;background:var(--accent2);opacity:.4}
.corner::before{width:1px;height:100%}.corner::after{height:1px;width:100%}
.corner-tl{top:12px;left:12px}.corner-tr{top:12px;right:12px;transform:scaleX(-1)}
.corner-bl{bottom:12px;left:12px;transform:scaleY(-1)}.corner-br{bottom:12px;right:12px;transform:scale(-1)}

/* particles */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.p{position:absolute;border-radius:50%;animation:pfloat linear infinite;opacity:0}
@keyframes pfloat{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:.3}100%{transform:translateY(-50px);opacity:0}}

/* ─ HEADER ─ */
header{position:sticky;top:0;z-index:100;height:66px;
  background:rgba(9,9,15,0.92);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border2);
  padding:0 2rem;display:flex;align-items:center;justify-content:space-between}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}

.logo-wrap{display:flex;align-items:center;gap:.9rem}
.logo-icon{width:38px;height:38px;border:1px solid var(--border2);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--surface2),var(--accent3));
  box-shadow:0 0 16px var(--glow);position:relative}
.radar-svg{width:22px;height:22px}
.logo-texts{display:flex;flex-direction:column}
.logo-main{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:900;
  letter-spacing:3px;color:var(--white);line-height:1}
.logo-main em{color:var(--accent2);font-style:normal}
.logo-sub{font-size:.55rem;font-family:'Share Tech Mono',monospace;
  color:var(--sub);letter-spacing:2px;margin-top:2px}
.live-pill{display:flex;align-items:center;gap:5px;
  background:var(--red2);border:1px solid rgba(244,63,94,.35);
  border-radius:999px;padding:3px 10px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--red);
  box-shadow:0 0 6px var(--red);animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-txt{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--red);letter-spacing:2px}

.hdr-right{display:flex;align-items:center;gap:1rem}
.status-row{display:flex;align-items:center;gap:.4rem}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sdot.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
.sdot.scan{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse .4s infinite}
#status-text{font-family:'Share Tech Mono',monospace;font-size:.65rem;color:var(--sub)}

.isel{background:var(--surface);border:1px solid var(--border2);color:var(--text);
  padding:5px 10px;border-radius:6px;font-family:'Share Tech Mono',monospace;
  font-size:.68rem;cursor:pointer;outline:none;appearance:none}
.tbtn{font-family:'Orbitron',monospace;font-size:.58rem;font-weight:700;letter-spacing:1.5px;
  padding:7px 18px;border:1px solid var(--accent);background:var(--accent3);
  color:var(--accent2);cursor:pointer;border-radius:6px;transition:all .2s}
.tbtn:hover{background:var(--accent);color:#fff;box-shadow:0 0 16px var(--glow)}
.tbtn.stop{border-color:var(--red);background:var(--red2);color:var(--red)}
.tbtn.stop:hover{background:var(--red);color:#fff}

/* ─ MAIN ─ */
main{max-width:1140px;margin:0 auto;padding:1.5rem 1.5rem 5rem;position:relative;z-index:1}

/* ─ STATS ─ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--border);border:1px solid var(--border2);border-radius:10px;
  overflow:hidden;margin-bottom:1.5rem}
.sc{background:var(--surface);padding:.9rem 1.2rem;display:flex;flex-direction:column;gap:.2rem;
  transition:background .2s}
.sc:hover{background:var(--surface2)}
.sl{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--sub);letter-spacing:2px}
.sv{font-family:'Orbitron',monospace;font-size:1.6rem;font-weight:700;color:var(--text);line-height:1}
.sv.a{color:var(--accent2)}.sv.r{color:var(--red)}.sv.g{color:var(--green);font-size:.85rem;padding-top:.35rem;font-family:'Share Tech Mono',monospace}

/* ─ NOTIF BANNER ─ */
.nbanner{display:none;align-items:center;gap:1rem;justify-content:space-between;
  background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.3);
  border-left:3px solid var(--amber);padding:.75rem 1.2rem;border-radius:6px;margin-bottom:1rem}
.nbanner p{font-size:.82rem;color:var(--amber);font-family:'Share Tech Mono',monospace}
.nbtn{font-family:'Orbitron',monospace;font-size:.58rem;padding:5px 14px;
  border:1px solid var(--amber);background:transparent;color:var(--amber);
  cursor:pointer;border-radius:4px;letter-spacing:1.5px;transition:all .2s;white-space:nowrap}
.nbtn:hover{background:var(--amber);color:var(--bg)}

/* ─ COUNTDOWN ─ */
.cdstrip{display:none;align-items:center;gap:.8rem;margin-bottom:1rem;
  padding:.45rem 1rem;background:var(--surface);border:1px solid var(--border2);border-radius:6px}
.cdlabel{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--sub);white-space:nowrap}
.cdtrack{flex:1;height:2px;background:var(--dim);border-radius:1px;overflow:hidden}
.cdfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 6px var(--glow);border-radius:1px;transition:width 1s linear}
.cdtimer{font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--accent2);min-width:32px;text-align:right}

/* ─ TOOLBAR ─ */
.toolbar{display:flex;gap:.6rem;margin-bottom:.9rem;align-items:center;flex-wrap:wrap}
.sbox{flex:1;min-width:180px;display:flex;align-items:center;gap:.5rem;
  background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:0 .9rem;
  transition:border-color .2s,box-shadow .2s}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.sbox svg{width:13px;height:13px;opacity:.35;color:var(--accent2);flex-shrink:0}
.sbox input{background:transparent;border:none;color:var(--text);padding:9px 0;
  font-family:'Share Tech Mono',monospace;font-size:.75rem;outline:none;width:100%}
.sbox input::placeholder{color:var(--sub)}
.fsel,.sortbtn,.clrbtn{background:var(--surface);border:1px solid var(--border2);color:var(--sub);
  padding:9px 12px;border-radius:8px;font-family:'Share Tech Mono',monospace;font-size:.68rem;
  cursor:pointer;outline:none;appearance:none;transition:all .2s;white-space:nowrap}
.fsel:hover,.sortbtn:hover,.clrbtn:hover{border-color:var(--accent);color:var(--accent2)}

/* ─ PANEL HDR ─ */
.phdr{display:flex;align-items:center;justify-content:space-between;
  padding:.55rem 1rem;background:var(--surface);border:1px solid var(--border2);
  border-bottom:none;border-radius:10px 10px 0 0}
.ptitle{font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;
  color:var(--accent2);letter-spacing:3px}
.pmeta{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--sub)}

/* ─ NEWS CONTAINER ─ */
#news-container{border:1px solid var(--border2);border-radius:0 0 10px 10px;overflow:hidden}

/* ─ NEWS ITEM ─ */
.ni{display:grid;grid-template-columns:56px 1fr;align-items:stretch;
  text-decoration:none;color:inherit;border-bottom:1px solid var(--border);
  transition:background .15s;position:relative;min-height:90px}
.ni:last-child{border-bottom:none}
.ni:hover{background:var(--surface2)}
.ni::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--accent);transform:scaleY(0);transform-origin:center;transition:transform .25s}
.ni:hover::before,.ni.fresh::before{transform:scaleY(1)}
.ni.fresh{animation:freshIn 1s ease}
.ni.fresh::before{background:var(--red)}
@keyframes freshIn{0%{background:rgba(244,63,94,.12)}100%{background:transparent}}

/* rank col */
.ni-rank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border-right:1px solid var(--border)}
.rn{font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;color:var(--dim)}
.ni:hover .rn,.ni.fresh .rn{color:var(--sub)}
.ni.fresh .rn{color:var(--red)}

/* content col: image + text side by side */
.ni-content{display:flex;align-items:center;gap:0;min-width:0}

/* thumbnail */
.ni-thumb{width:88px;height:90px;flex-shrink:0;overflow:hidden;position:relative;background:var(--surface2)}
.ni-thumb img{width:100%;height:100%;object-fit:cover;opacity:.85;transition:opacity .2s}
.ni:hover .ni-thumb img{opacity:1}
.ni-thumb .thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--surface2),var(--surface));color:var(--dim);font-size:.7rem;
  font-family:'Share Tech Mono',monospace;letter-spacing:1px;flex-direction:column;gap:4px}
.thumb-icon{font-size:1.4rem;opacity:.4}

/* text body */
.ni-body{flex:1;padding:.75rem 1rem;display:flex;flex-direction:column;justify-content:center;gap:.45rem;min-width:0}
.ni-title{font-size:.95rem;font-weight:500;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:color .15s}
.ni:hover .ni-title{color:var(--white)}
.ni-meta{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.ni-src{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--accent2);
  letter-spacing:1px;white-space:nowrap}
.ni-sep{color:var(--dim);font-size:.65rem}
.ni-time{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--sub)}
.ni-new{font-family:'Orbitron',monospace;font-size:.48rem;font-weight:700;letter-spacing:1.5px;
  color:var(--red);border:1px solid rgba(244,63,94,.5);padding:1px 5px;border-radius:3px;
  animation:newbadge 2s ease 2}
@keyframes newbadge{0%,100%{opacity:1}50%{opacity:.4}}

/* arrow */
.ni-arrow{display:flex;align-items:center;padding:0 1rem;font-size:.9rem;color:var(--dim);
  flex-shrink:0;transition:all .2s}
.ni:hover .ni-arrow{color:var(--accent2);transform:translateX(3px)}

/* ─ SEE ALL ─ */
.see-all{display:none;border:1px solid var(--border2);border-top:none;
  border-radius:0 0 10px 10px;padding:.7rem;text-align:center}
.sa-btn{font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--sub);
  background:transparent;border:1px solid var(--border2);padding:6px 20px;
  cursor:pointer;border-radius:6px;letter-spacing:1.5px;transition:all .2s}
.sa-btn:hover{border-color:var(--accent);color:var(--accent2)}

/* ─ EMPTY STATE ─ */
.estate{padding:4rem 2rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.radar-wrap{width:72px;height:72px;position:relative}
.rring{position:absolute;inset:0;border:1px solid var(--border2);border-radius:50%;animation:rpulse 2s ease-out infinite}
.rring:nth-child(2){animation-delay:.7s}.rring:nth-child(3){animation-delay:1.4s}
.rsweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 70%,rgba(99,102,241,.5) 100%);
  animation:sweep 2.5s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes rpulse{0%{transform:scale(.2);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.etitle{font-family:'Orbitron',monospace;font-size:.9rem;font-weight:700;color:var(--sub);letter-spacing:3px}
.esub{font-family:'Share Tech Mono',monospace;font-size:.75rem;color:var(--dim);max-width:280px;line-height:1.7}

/* ─ TOAST ─ */
#toasts{position:fixed;top:78px;right:18px;z-index:9999;
  display:flex;flex-direction:column;gap:.4rem;width:340px;pointer-events:none}
.toast{background:rgba(9,9,15,0.97);border:1px solid var(--border2);border-left:3px solid var(--red);
  padding:.8rem 1rem;display:flex;gap:.7rem;border-radius:8px;
  animation:tin .3s cubic-bezier(.34,1.56,.64,1);cursor:pointer;pointer-events:all;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--red),transparent);border-radius:8px 8px 0 0}
.toast{position:relative}
.toast.out{animation:tout .22s ease forwards}
@keyframes tin{from{transform:translateX(360px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes tout{to{transform:translateX(360px);opacity:0}}
.tpulse{width:8px;height:8px;border-radius:50%;background:var(--red);
  box-shadow:0 0 8px var(--red);flex-shrink:0;margin-top:3px;animation:pulse .6s infinite}
.tbody{flex:1;min-width:0}
.ttag{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:2px;color:var(--red);margin-bottom:3px}
.ttitle{font-size:.82rem;font-weight:500;color:var(--white);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsrc{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--sub);margin-top:2px}
.tclose{color:var(--sub);font-size:.9rem;flex-shrink:0;align-self:flex-start;line-height:1;opacity:.6}
.tclose:hover{opacity:1}

/* ─ NOTIF PERMISSION OVERLAY ─ */
.notif-help{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--surface2);border:1px solid var(--border2);border-radius:10px;
  padding:1rem 1.5rem;text-align:center;max-width:420px;width:90%;
  box-shadow:0 16px 48px rgba(0,0,0,.5)}
.notif-help h4{font-family:'Orbitron',monospace;font-size:.75rem;color:var(--accent2);letter-spacing:2px;margin-bottom:.5rem}
.notif-help p{font-size:.8rem;color:var(--sub);line-height:1.5;margin-bottom:.8rem}
.notif-help .step{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--text);
  background:var(--surface);border:1px solid var(--border2);border-radius:6px;
  padding:.4rem .8rem;margin:.3rem 0;text-align:left}

@media(max-width:680px){
  header{padding:0 1rem}main{padding:1rem}
  .stats{grid-template-columns:1fr 1fr}
  .logo-main{font-size:.8rem}#toasts{width:calc(100vw - 36px)}
  .ni-thumb{width:64px;height:90px}
  .toolbar{gap:.4rem}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="particles" id="particles"></div>
<div class="corner corner-tl"></div><div class="corner corner-tr"></div>
<div class="corner corner-bl"></div><div class="corner corner-br"></div>
<div id="toasts"></div>

<!-- HEADER -->
<header>
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg class="radar-svg" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="17" stroke="rgba(99,102,241,0.35)" stroke-width="1.2"/>
        <circle cx="20" cy="20" r="10" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
        <circle cx="20" cy="20" r="3" stroke="rgba(99,102,241,0.5)" stroke-width="1"/>
        <line x1="20" y1="3" x2="20" y2="37" stroke="rgba(99,102,241,0.2)" stroke-width=".8"/>
        <line x1="3" y1="20" x2="37" y2="20" stroke="rgba(99,102,241,0.2)" stroke-width=".8"/>
        <path d="M20 20 L20 3" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 20 20" to="360 20 20" dur="3s" repeatCount="indefinite"/>
        </path>
        <circle cx="20" cy="20" r="1.5" fill="#818cf8"/>
      </svg>
    </div>
    <div class="logo-texts">
      <div class="logo-main"><em>SAMSUN</em> RADAR</div>
      <div class="logo-sub">HABER İSTİHBARAT SİSTEMİ v2.1</div>
    </div>
    <div class="live-pill"><div class="live-dot"></div><span class="live-txt">CANLI</span></div>
  </div>
  <div class="hdr-right">
    <div class="status-row">
      <div class="sdot" id="sdot"></div>
      <span id="status-text">BEKLEME</span>
    </div>
    <select class="isel" id="isel">
      <option value="60">1 dak</option>
      <option value="300" selected>5 dak</option>
      <option value="600">10 dak</option>
      <option value="1800">30 dak</option>
    </select>
    <button class="tbtn" id="tbtn" onclick="toggle()">BAŞLAT</button>
  </div>
</header>

<main>
  <!-- STATS -->
  <div class="stats">
    <div class="sc"><div class="sl">TOPLAM HABER</div><div class="sv a" id="st-total">000</div></div>
    <div class="sc"><div class="sl">YENİ HABER</div><div class="sv r" id="st-new">000</div></div>
    <div class="sc"><div class="sl">AKTİF KAYNAK</div><div class="sv" id="st-src">012</div></div>
    <div class="sc"><div class="sl">SON TARAMA</div><div class="sv g" id="st-last">——:——:——</div></div>
  </div>

  <!-- NOTIF BANNER -->
  <div class="nbanner" id="nbanner">
    <p>🔔 Chrome bildirimleri için izin gerekiyor</p>
    <button class="nbtn" onclick="reqPerm()">İZİN VER</button>
  </div>

  <!-- COUNTDOWN -->
  <div class="cdstrip" id="cdstrip">
    <span class="cdlabel">SONRAKİ TARAMA</span>
    <div class="cdtrack"><div class="cdfill" id="cdfill" style="width:100%"></div></div>
    <span class="cdtimer" id="cdtimer">—</span>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="sinput" placeholder="Haberlerde ara..." oninput="render()">
    </div>
    <select class="fsel" id="fsrc" onchange="render()">
      <option value="">Tüm Kaynaklar</option>
      <option>Samsun Gazetesi</option><option>Samsun Haber</option>
      <option>Samsun Haber Ajansı</option><option>Samsun Haber X</option>
      <option>Gazete Gerçek</option><option>Hedef Halk</option>
      <option>Samsun TV</option><option>Samsun Canlı Haber</option>
      <option>Samsun Kent Haber</option><option>Gazete Arena</option>
      <option>Denge Gazetesi</option><option>FeedControl</option>
    </select>
    <button class="sortbtn" id="sortbtn" onclick="flipSort()">↓ En Yeni</button>
    <button class="clrbtn" onclick="clearAll()">Temizle</button>
  </div>

  <!-- PANEL HDR -->
  <div class="phdr">
    <span class="ptitle">HABERLEŞTİRME AKIŞI</span>
    <span class="pmeta" id="pmeta">—</span>
  </div>

  <!-- NEWS -->
  <div id="news-container">
    <div class="estate">
      <div class="radar-wrap">
        <div class="rring"></div><div class="rring"></div><div class="rring"></div>
        <div class="rsweep"></div>
      </div>
      <div class="etitle">RADAR HAZIR</div>
      <div class="esub">Samsun haberlerini takip etmek için BAŞLAT butonuna basın.</div>
    </div>
  </div>

  <!-- SEE ALL -->
  <div class="see-all" id="see-all">
    <button class="sa-btn" id="sa-btn" onclick="flipShow()">Tüm haberleri göster ▼</button>
  </div>
</main>

<script>
// ── STATE ──
let on=false,si=null,cdi=null,seen=new Set(),news=[],sc=0,nc=0,ns=null,sasc=false,showAll=false;
const PG=10;

// ── SOURCES ──
const SRC=[
  {n:'Samsun Gazetesi',    u:'https://www.samsungazetesi.com/rss'},
  {n:'Samsun Haber',       u:'https://www.samsunhaber.com/rss'},
  {n:'Samsun Haber Ajansı',u:'https://www.samsunhaberajansi.com/rss.xml'},
  {n:'Samsun Haber X',     u:'https://www.samsunhaberx.com/rss_samsun-haberleri_2.xml'},
  {n:'Gazete Gerçek',      u:'https://www.gazetegercek.com.tr/rss_samsun-haber_20.xml'},
  {n:'Hedef Halk',         u:'https://www.hedefhalk.com/rss_samsun-haber_1764.xml'},
  {n:'Samsun TV',          u:'https://www.samsuntv.com.tr/rss/samsun-haber-12'},
  {n:'Samsun Canlı Haber', u:'https://www.samsuncanlihaber.com/rss'},
  {n:'Samsun Kent Haber',  u:'https://www.samsunkenthaber.com.tr/rss_samsun-haber_30.xml'},
  {n:'Gazete Arena',       u:'https://www.gazetearena.com/rss.xml',mx:true},
  {n:'Denge Gazetesi',     u:'https://www.dengegazetesi.com.tr/service/rss.php',mx:true},
  {n:'FeedControl',        u:'https://cdn.feedcontrol.net/8757/14506-Fk06zfvoh6QP5.xml',mx:true},
];

// ── PROXIES ──
const PX=[
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u=>`https://thingproxy.freeboard.io/fetch/${encodeURIComponent(u)}`,
];
async function pfetch(url){
  for(const f of PX){
    try{
      const r=await fetch(f(url),{signal:AbortSignal.timeout(8000)});
      if(!r.ok)continue;
      const t=await r.text();
      if(t.trim().startsWith('{')){try{const j=JSON.parse(t);if(j.contents)return j.contents;}catch{}}
      if(t.includes('<item')||t.includes('<rss')||t.includes('<feed'))return t;
    }catch{}
  }
  throw new Error('failed: '+url);
}

// ── TRACKING ──
function toggle(){on?stop():start();}
function start(){
  on=true;
  const b=document.getElementById('tbtn');b.textContent='DURDUR';b.classList.add('stop');
  document.getElementById('cdstrip').style.display='flex';
  checkPerm();fetch_all();
  const s=+document.getElementById('isel').value;
  si=setInterval(fetch_all,s*1000);
}
function stop(){
  on=false;clearInterval(si);clearInterval(cdi);
  const b=document.getElementById('tbtn');b.textContent='BAŞLAT';b.classList.remove('stop');
  document.getElementById('cdstrip').style.display='none';
  dot('','DURDURULDU');
}
document.getElementById('isel').addEventListener('change',()=>{
  if(!on)return;clearInterval(si);
  const s=+document.getElementById('isel').value;
  si=setInterval(fetch_all,s*1000);cd(s);
});

// ── COUNTDOWN ──
function cd(total){
  clearInterval(cdi);ns=Date.now()+total*1000;
  cdi=setInterval(()=>{
    const rem=Math.max(0,Math.ceil((ns-Date.now())/1000));
    document.getElementById('cdtimer').textContent=rem+'s';
    document.getElementById('cdfill').style.width=((rem/total)*100)+'%';
  },1000);
}

// ── FETCH ──
async function fetch_all(){
  dot('scan','TARANIYOR');
  const s=+document.getElementById('isel').value;cd(s);
  const res=await Promise.allSettled(SRC.map(fetchOne));
  res.forEach(r=>{
    if(r.status!=='fulfilled')return;
    r.value.forEach(item=>{
      if(!seen.has(item.id)){
        seen.add(item.id);item.fresh=sc>0;news.push(item);
        if(sc>0){nc++;toast(item);chromePush(item);}
      }
    });
  });
  news.sort((a,b)=>b.d-a.d);sc++;stats();render();
  dot('on','AKTİF · '+SRC.length+' KAYNAK');
  document.getElementById('st-last').textContent=new Date().toLocaleTimeString('tr-TR');
}

async function fetchOne(src){
  const xml=await pfetch(src.u);
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const items=doc.querySelectorAll('item');
  const out=[];
  items.forEach(it=>{
    const title=(it.querySelector('title')?.textContent||'').trim();
    let link=it.querySelector('link')?.textContent?.trim()||'';
    if(!link){const le=it.querySelector('link');if(le)link=le.nextSibling?.nodeValue?.trim()||'';}
    if(!link)link=it.querySelector('guid')?.textContent?.trim()||'';
    const pd=it.querySelector('pubDate')?.textContent||'';
    const desc=it.querySelector('description')?.textContent||'';

    // Try to extract image
    let img='';
    // enclosure tag
    const enc=it.querySelector('enclosure');
    if(enc&&enc.getAttribute('type')?.startsWith('image'))img=enc.getAttribute('url')||'';
    // media:content
    if(!img){const mc=it.querySelector('content');if(mc)img=mc.getAttribute('url')||'';}
    // media:thumbnail
    if(!img){const mt=it.querySelector('thumbnail');if(mt)img=mt.getAttribute('url')||'';}
    // og:image in description
    if(!img&&desc){const m=desc.match(/src="([^"]*\.(jpg|jpeg|png|webp)[^"]*)"/i);if(m)img=m[1];}
    // Try parsing URL to guess source image
    if(!img&&link){
      const domain=link.replace(/https?:\/\//,'').split('/')[0];
      // Use favicon as last fallback (stored for later)
    }

    if(!title)return;
    if(src.mx&&!(title+' '+desc).toLowerCase().includes('samsun'))return;
    out.push({id:link||title,t:clean(title),u:link,src:src.n,d:pd?new Date(pd).getTime():0,img,fresh:false});
  });
  return out;
}

// ── RENDER ──
function render(){
  const q=document.getElementById('sinput').value.toLowerCase();
  const fsrc=document.getElementById('fsrc').value;
  let f=news.filter(n=>{
    if(q&&!n.t.toLowerCase().includes(q)&&!n.src.toLowerCase().includes(q))return false;
    if(fsrc&&n.src!==fsrc)return false;return true;
  });
  f=[...f].sort((a,b)=>sasc?a.d-b.d:b.d-a.d);
  document.getElementById('pmeta').textContent=f.length+' kayıt · '+(showAll?'tümü':'son '+PG);
  document.getElementById('see-all').style.display=f.length>PG?'block':'none';
  const ctr=document.getElementById('news-container');
  if(!f.length){
    ctr.innerHTML=`<div class="estate"><div class="radar-wrap"><div class="rring"></div><div class="rring"></div><div class="rring"></div><div class="rsweep"></div></div>
      <div class="etitle">${q||fsrc?'SONUÇ YOK':on?'TARANIYOR':'HAZIR'}</div>
      <div class="esub">${q||fsrc?'Filtreyle eşleşen kayıt yok.':on?'Kaynaklar taranıyor...':'BAŞLAT butonuna basın.'}</div></div>`;
    return;
  }
  const disp=showAll?f:f.slice(0,PG);
  ctr.innerHTML=disp.map((n,i)=>{
    const thumb=n.img
      ? `<div class="ni-thumb"><img src="${esc(n.img)}" loading="lazy" alt="" onerror="this.parentNode.innerHTML='<div class=\\'thumb-placeholder\\'><span class=\\'thumb-icon\\'>📰</span></div>'"></div>`
      : `<div class="ni-thumb"><div class="thumb-placeholder"><span class="thumb-icon">📰</span></div></div>`;
    return `<a class="ni${n.fresh?' fresh':''}" href="${esc(n.u)}" target="_blank" rel="noopener">
      <div class="ni-rank"><span class="rn">${String(i+1).padStart(2,'0')}</span></div>
      <div class="ni-content">
        ${thumb}
        <div class="ni-body">
          <div class="ni-title">${esc(n.t)}</div>
          <div class="ni-meta">
            <span class="ni-src">${esc(n.src)}</span>
            <span class="ni-sep">/</span>
            <span class="ni-time">${reltime(n.d)}</span>
            ${n.fresh?'<span class="ni-new">YENİ</span>':''}
          </div>
        </div>
      </div>
      <div class="ni-arrow">›</div>
    </a>`;
  }).join('');
  setTimeout(()=>document.querySelectorAll('.fresh').forEach(e=>e.classList.remove('fresh')),1800);
}

function flipSort(){sasc=!sasc;document.getElementById('sortbtn').textContent=sasc?'↑ En Eski':'↓ En Yeni';render();}
function flipShow(){showAll=!showAll;document.getElementById('sa-btn').textContent=showAll?'Daha az göster ▲':'Tüm haberleri göster ▼';render();}
function clearAll(){if(!confirm('Tüm haberler silinsin mi?'))return;news=[];seen=new Set();nc=0;sc=0;showAll=false;stats();render();}
function stats(){
  document.getElementById('st-total').textContent=String(news.length).padStart(3,'0');
  document.getElementById('st-new').textContent=String(nc).padStart(3,'0');
}

// ── TOAST ──
function toast(item){
  const c=document.getElementById('toasts');
  const t=document.createElement('div');t.className='toast';t.style.position='relative';
  t.innerHTML=`<div class="tpulse"></div>
    <div class="tbody"><div class="ttag">YENİ HABER</div>
      <div class="ttitle">${esc(item.t)}</div>
      <div class="tsrc">${esc(item.src)} · ${reltime(item.d)}</div>
    </div><div class="tclose">✕</div>`;
  t.onclick=e=>{if(e.target.classList.contains('tclose')){rmToast(t);return;}if(item.u)window.open(item.u,'_blank');};
  c.appendChild(t);setTimeout(()=>rmToast(t),7000);
}
function rmToast(t){t.classList.add('out');setTimeout(()=>t.remove(),280);}

// ── CHROME NOTIFICATIONS ──
function checkPerm(){
  if(!('Notification'in window))return;
  const p=Notification.permission;
  document.getElementById('nbanner').style.display=p==='default'?'flex':'none';
}
function reqPerm(){
  Notification.requestPermission().then(p=>{
    document.getElementById('nbanner').style.display=p==='granted'?'none':'flex';
    if(p==='granted')chromePush({t:'Samsun Radar aktif! Yeni haberler için bildirim alacaksınız.',src:'Sistem',u:'',d:Date.now()});
  });
}
function chromePush(item){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  // Chrome requires either a service worker for persistent notifications
  // or basic Notification API for foreground notifications
  try{
    const n=new Notification('📡 Samsun Radar — Yeni Haber',{
      body:item.t+(item.src?'\n'+item.src:''),
      icon:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#09090f"/><circle cx="32" cy="32" r="26" stroke="#818cf8" stroke-width="1.5" fill="none"/><circle cx="32" cy="32" r="16" stroke="#6366f1" stroke-width="1" fill="none" opacity=".6"/><circle cx="32" cy="32" r="6" stroke="#6366f1" stroke-width="1" fill="none" opacity=".3"/><circle cx="32" cy="32" r="2.5" fill="#818cf8"/><line x1="32" y1="6" x2="32" y2="32" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/></svg>'),
      tag:'sr-'+String(item.id||item.t).slice(0,48),
      requireInteraction:false,
      silent:false,
    });
    n.onclick=()=>{if(item.u)window.open(item.u,'_blank');n.close();window.focus();};
    setTimeout(()=>n.close(),9000);
  }catch(e){console.warn('Notif err:',e.message);}
}

// ── STATUS DOT ──
function dot(state,txt){
  const d=document.getElementById('sdot');d.className='sdot';
  if(state==='on')d.classList.add('on');if(state==='scan')d.classList.add('scan');
  document.getElementById('status-text').textContent=txt;
}

// ── HELPERS ──
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clean(s){return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/<[^>]+>/g,'').trim();}
function reltime(d){
  if(!d)return'bilinmiyor';const diff=Date.now()-d;
  if(diff<60000)return'az önce';if(diff<3600000)return Math.floor(diff/60000)+' dak';
  if(diff<86400000)return Math.floor(diff/3600000)+' saat';
  return new Date(d).toLocaleDateString('tr-TR');
}

// ── PARTICLES ──
(function(){
  const c=document.getElementById('particles');
  const colors=['rgba(99,102,241,0.6)','rgba(129,140,248,0.5)','rgba(244,63,94,0.4)'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');p.className='p';
    const sz=Math.random()>0.7?2:1;
    p.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${10+Math.random()*18}s;animation-delay:${Math.random()*12}s`;
    c.appendChild(p);
  }
})();

// init
checkPerm();
</script>
</body>
</html>
