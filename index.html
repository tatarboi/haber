<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsun Haber Takip Radarı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .haber-karti:hover { transform: translateY(-5px); transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-red-600 mb-2">Samsun Haber Radarı</h1>
            <p class="text-lg text-gray-600">Şehrin nabzı tek bir ekranda.</p>
        </header>

        <!-- Haberlerin listeleneceği alan -->
        <div id="haber-konteyner" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS ile kartlar buraya eklenecek -->
        </div>
    </div>

    <script>
        // JSON dosyasını çekip ekrana basan fonksiyon
        async function haberleriYukle() {
            try {
                // cache'i bypass etmek için query parametresi ekliyoruz
                const response = await fetch('samsun_gundem.json?t=' + new Date().getTime());
                const haberler = await response.json();
                
                const konteyner = document.getElementById('haber-konteyner');
                konteyner.innerHTML = '';

                haberler.forEach(haber => {
                    const kart = `
                        <div class="haber-karti bg-white rounded-xl shadow-md overflow-hidden flex flex-col">
                            <div class="p-6 flex-grow">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="inline-flex items-center px-3 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">
                                        ${haber.kaynak}
                                    </span>
                                </div>
                                <a href="${haber.link}" target="_blank" class="block mt-2 text-xl font-semibold text-gray-900 hover:text-red-600 transition-colors">
                                    ${haber.baslik}
                                </a>
                                <p class="mt-3 text-base text-gray-500 line-clamp-3">
                                    ${haber.ozet.replace(/(<([^>]+)>)/gi, "")}
                                </p>
                            </div>
                            <div class="bg-gray-50 px-6 py-4 mt-auto border-t border-gray-100 flex justify-between items-center">
                                <span class="text-sm text-gray-500 font-medium">${new Date(haber.tarih).toLocaleDateString('tr-TR')}</span>
                                <a href="${haber.link}" target="_blank" class="text-red-600 hover:text-red-800 font-semibold text-sm">Habere Git &rarr;</a>
                            </div>
                        </div>
                    `;
                    konteyner.innerHTML += kart;
                });
            } catch (error) {
                console.error("Haberler yüklenirken hata oluştu:", error);
                document.getElementById('haber-konteyner').innerHTML = '<p class="text-red-500 font-bold col-span-full text-center">Haberler çekilemedi. JSON dosyasını kontrol et.</p>';
            }
        }

        // Sayfa yüklendiğinde çalıştır
        window.onload = haberleriYukle;
    </script>
</body>
</html>
